name: Verify Playverse

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, "phase-1/foundation", "phase-2/interface", "phase-3/size-it-up", "phase-4/daily-archive", "phase-5/higher-or-lower", "fix/phase-audit-build-and-tests", "phase-6/personal-progress", "phase-8/quality-launch"]
  push:
    branches: [main, "phase-1/foundation", "phase-2/interface", "phase-3/size-it-up", "phase-4/daily-archive", "phase-5/higher-or-lower"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Build GitHub Pages variant
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Dependency security audit
        run: npm audit --json
