name: Verify Playverse

on:
  pull_request:
    branches: [main, "phase-1/foundation", "phase-2/interface", "phase-3/size-it-up", "phase-4/daily-archive"]
  push:
    branches: [main, "phase-1/foundation", "phase-2/interface", "phase-3/size-it-up", "phase-4/daily-archive"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
